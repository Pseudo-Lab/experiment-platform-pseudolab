name: Stage SDK on npm

on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    concurrency: sdk-npm-publish
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@pseudo-lab'

      - name: Install npm with staged publishing support
        run: npm install --global npm@11.21.2

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag sdk-v$TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Install SDK dependencies
        run: npm ci

      - name: Typecheck SDK
        run: npm run typecheck

      - name: Build and test SDK
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Dry-run npm stage
        run: npm stage publish --dry-run --access public

      # Public release requires a maintainer's separate approval on npmjs.com.
      - name: Stage package for npm approval
        run: npm stage publish --access public --provenance
